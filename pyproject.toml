[project]
name = "fig-jam"
version = "0.1.0.dev0"
description = "Agnostic fonfig manager"
readme = "README.md"
authors = [
    { name = "Martin Hanicinec", email = "hanicinecm@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipython>=8.37.0",
    "pydantic>=2.12.4",
    "pytest-cov>=7.0.0",
    "pyyaml>=6.0.3",
    "ruff>=0.14.2",
    "syrupy>=5.0.0",
]
